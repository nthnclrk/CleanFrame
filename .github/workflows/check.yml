name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLEANFRAME_PUBLIC_FONTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'
      - run: npm ci
      - run: npm run check
      - run: npm run check:tools
      - run: python3 -B scripts/native-home/frame-2023/check.py --dotnet "$(command -v dotnet)"
      - run: npm run check:public
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser
      - run: npm run export:public

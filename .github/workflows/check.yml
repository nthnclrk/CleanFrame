name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLEANFRAME_PUBLIC_FONTS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run check:public
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser
      - run: npm run export:public

<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleanFrame</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/typefaces.css">
<link rel="stylesheet" href="assets/private-fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
      <main class="stage" id="stage" tabindex="0" aria-label="TV stage, 1920 by 1080. Click it, then use the arrow keys, Enter for OK and Escape for Back.">
        <div class="scene" id="scene">
        <div class="bg" id="bg" aria-hidden="true">
          <img class="photo" id="photo" alt="">
          <div class="scrim"></div>
          <div class="shade"></div>
          <div class="ph-dim"></div>
          <div class="ph-scrim"></div>
          <div class="ph-col"></div>
          <div class="ut-dim ut-tr"></div><div class="ut-dim ut-br"></div>
        </div>

        <div class="home" id="home">
          <div class="caption" id="caption"></div>
          <nav class="utils" id="utils" aria-label="Home controls"></nav>
          <div class="util-focus-label" id="utilFocusLabel" aria-hidden="true"></div>
          <div class="app-focus-name" id="appFocusName" aria-hidden="true"></div>
          <div class="ph-plate ut-lens" id="utLens" aria-hidden="true">
            <div class="ph-field" id="utField">
              <img class="ph-field-img" id="utFieldImg" alt="">
              <div class="scrim"></div><div class="shade"></div><div class="ph-dim"></div><div class="ph-scrim"></div><div class="ph-col"></div><div class="ut-dim ut-tr"></div><div class="ut-dim ut-br"></div>
            </div><div class="ph-veil"></div>
          </div>
          <div class="ph-plate ut-lens" id="utLensAlt" aria-hidden="true">
            <div class="ph-field" id="utFieldAlt">
              <img class="ph-field-img" id="utFieldImgAlt" alt="">
              <div class="scrim"></div><div class="shade"></div><div class="ph-dim"></div><div class="ph-scrim"></div><div class="ph-col"></div><div class="ut-dim ut-tr"></div><div class="ut-dim ut-br"></div>
            </div><div class="ph-veil"></div>
          </div>

          <div class="dock" id="dock">
            <div class="mat" aria-hidden="true"><img class="mat-img" id="matImg" alt=""><div class="mat-scrim" id="matScrim"></div><div class="mat-veil"></div></div>
            <div class="shelf" id="shelf"><div class="track" id="track"><div class="plate" id="plate"></div></div></div>
            <div class="dock-empty" id="dockEmpty"></div>
          </div>
          <div class="cue" id="cueL" aria-hidden="true"></div>
          <div class="cue" id="cueR" aria-hidden="true"></div>
          <div class="dock-action" id="dockAction" role="button"></div>

          <div class="ph-scene" id="phScene">
            <div class="ph-plate" id="phPlate" aria-hidden="true">
              <div class="ph-field" id="phField">
                <img class="ph-field-img" id="phFieldImg" alt="">
                <div class="shade"></div><div class="ph-dim"></div><div class="ph-scrim"></div><div class="ph-col"></div><div class="ut-dim ut-tr"></div><div class="ut-dim ut-br"></div>
              </div>
              <div class="ph-veil"></div>
            </div>
            <div class="ph-plate" id="phPlateAlt" aria-hidden="true">
              <div class="ph-field" id="phFieldAlt">
                <img class="ph-field-img" id="phFieldImgAlt" alt="">
                <div class="shade"></div><div class="ph-dim"></div><div class="ph-scrim"></div><div class="ph-col"></div><div class="ut-dim ut-tr"></div><div class="ut-dim ut-br"></div>
              </div>
              <div class="ph-veil"></div>
            </div>
            <div class="ph-list" id="phList"><div class="ph-rows" id="phRows"></div></div>
            <div class="ph-action" id="phAction" role="button"></div>
            <div class="ph-empty" id="phEmpty"></div>
          </div>

        </div>

        </div>
        <section class="appearance" id="appearance" hidden role="dialog" aria-labelledby="appearanceTitle">
          <div class="settings-back" id="appearanceBack"></div>
          <h2 class="settings-title" id="appearanceTitle"></h2>
          <div class="appearance-rows" id="appearanceRows"></div>
          <p class="appearance-desc" id="appearanceDesc"></p>
          <div class="settings-status" id="appearanceStatus" aria-live="polite"></div>
        </section>
        <div class="sheet" id="sheet" hidden>
          <img class="sheet-bg" id="sheetBg" alt="" aria-hidden="true">
          <div class="sheet-veil" aria-hidden="true"></div>
          <div class="view" id="sheetView" role="dialog" aria-modal="true"></div>
        </div>
        <div class="focus-status" id="focusStatus" aria-live="polite"></div>
      </main>
<script src="assets/apps/catalog.js"></script>
<script src="device.js"></script>
<script src="assets/icons/metrics.js"></script>
<script src="assets/wallpapers/catalog.js"></script>
<script src="assets/adaptive-ink.js"></script>
<script src="assets/font-catalog.js"></script>
<script src="main.js"></script>
</body>
</html>
